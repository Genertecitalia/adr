<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calcolatore pesi</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1f2933;--mut:#6b7785;--ac:#0f6cbd;--bd:#dde1e6;--red:#c4314b}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px}h1{font-size:20px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
input,button{font:inherit}
input{border:1px solid var(--bd);border-radius:6px;padding:6px 8px;width:100%}
button{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--red)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{font-size:12px;text-transform:uppercase;color:var(--mut)}td.n,th.n{text-align:right;white-space:nowrap}
td input.q{width:80px;text-align:right}
.tot{position:sticky;bottom:0;border-color:var(--ac)}
.tot b{font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.un{background:#eef4fb;border-radius:6px;padding:8px;margin-top:8px;word-break:break-word}
.note{color:var(--mut);font-size:13px;margin:0 0 8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9}
#modal .card{width:320px;margin:0}.err{color:var(--red);font-size:13px;min-height:18px}
</style></head><body><div class="wrap">
<div class="top"><h1 id="title">Calcolatore pesi</h1><button id="adm">🔒 Admin</button></div>
<div id="app"></div>
</div>
<script id="seed" type="application/json">{"unText": "UN 3480, PILE AGLI IONI DI LITIO, 9, (E)", "items": [{"id": "i1", "name": "AS1", "kg": 70.0}, {"id": "i2", "name": "B1-5.1-48", "kg": 50.0}, {"id": "i3", "name": "B2-5.0-LV2", "kg": 50.0}, {"id": "i4", "name": "BOS-G", "kg": 49.7}, {"id": "i5", "name": "BU2-5,1-HV1", "kg": 60.0}, {"id": "i6", "name": "BU3-5.0-TV2-PRO", "kg": 55.0}, {"id": "i7", "name": "CB2-100.3-HV5", "kg": 1260.0}, {"id": "i8", "name": "CHS2 (30KW/57.3KWH)", "kg": 1182.0}, {"id": "i9", "name": "CHS2 (50KW/100KWH)", "kg": 1423.0}, {"id": "i10", "name": "CHS2 (50KW/71.6KWH)", "kg": 1171.0}, {"id": "i11", "name": "CHS2 (50KW/85.9KWH)", "kg": 1322.0}, {"id": "i12", "name": "CM2-125K-261", "kg": 2500.0}, {"id": "i13", "name": "CM2800", "kg": 38.15}, {"id": "i14", "name": "CM2900", "kg": 39.73}, {"id": "i15", "name": "CM4100", "kg": 42.75}, {"id": "i16", "name": "CM4300", "kg": 39.0}, {"id": "i17", "name": "CS2800", "kg": 31.2}, {"id": "i18", "name": "CS2900", "kg": 34.19}, {"id": "i19", "name": "CS4100", "kg": 35.8}, {"id": "i20", "name": "CS4300", "kg": 37.62}, {"id": "i21", "name": "EP12", "kg": 107.0}, {"id": "i22", "name": "EP6", "kg": 56.9}, {"id": "i23", "name": "EQ6000PLUS-M", "kg": 52.0}, {"id": "i24", "name": "EQ6000PLUS-S", "kg": 48.8}, {"id": "i25", "name": "HV2500", "kg": 28.5}, {"id": "i26", "name": "HV2600", "kg": 29.5}, {"id": "i27", "name": "HV2600 V1", "kg": 29.7}, {"id": "i28", "name": "P100-6-H", "kg": 115.0}, {"id": "i29", "name": "CQ7-M", "kg": 55.0}, {"id": "i30", "name": "CQ7-S", "kg": 50.0}]}</script>
<script id="main">
const DEF_HASH="240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9"; // 默认密码 admin123，登录后台后可在页面内修改
const DRAFT="calc_draft";
let data=JSON.parse(document.getElementById('seed').textContent),admin=false,qty={};
const $=s=>document.querySelector(s),app=$('#app');
const fmt=n=>n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function load(){
  try{const r=await fetch('articoli.json?'+Date.now(),{cache:'no-store'});if(r.ok)data=await r.json()}catch(e){}
  show();if(/[?&]admin/.test(location.search))loginBox();
}
$('#adm').onclick=()=>admin?location.reload():loginBox();
function loginBox(){
  const m=document.createElement('div');m.id='modal';
  m.innerHTML=`<div class="card"><b>管理员登录 / Accesso amministratore</b><p><input id="pw" type="password" placeholder="Password" autofocus></p><div class="err" id="er"></div>
  <div class="row"><button id="no">取消</button><span style="flex:1"></span><button id="ok" class="p">登录</button></div></div>`;
  document.body.appendChild(m);const pw=$('#pw');pw.focus();
  const go=async()=>{let h;try{h=await sha(pw.value)}catch(e){$('#er').textContent='请用 https 或 Chrome/Edge 打开';return}
    if(h===(data.pwHash||DEF_HASH)){m.remove();enter()}else{$('#er').textContent='密码错误 / Password errata';pw.select()}};
  $('#ok').onclick=go;pw.onkeydown=e=>{if(e.key==='Enter')go();if(e.key==='Escape')m.remove()};$('#no').onclick=()=>m.remove();
}
function enter(){
  admin=true;try{const d=localStorage.getItem(DRAFT);if(d&&confirm('发现未发布的草稿，是否继续编辑草稿？\n(取消 = 使用当前已发布数据)'))data=JSON.parse(d)}catch(e){}
  showAdmin();
}
function show(){
  $('#title').textContent='Calcolatore pesi';$('#adm').textContent='🔒 Admin';
  app.innerHTML=`<div class="card"><input id="s" type="search" placeholder="Cerca articolo…"></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Articolo</th><th class="n">KG</th><th class="n">Quantità</th><th class="n">Peso (kg)</th></tr></thead><tbody>
  ${data.items.map(i=>`<tr data-id="${i.id}" data-n="${esc(i.name.toLowerCase())}"><td>${esc(i.name)}</td><td class="n">${fmt(i.kg)}</td>
  <td class="n"><input class="q" type="number" min="0" step="1" inputmode="numeric" value="${qty[i.id]||''}" placeholder="0"></td><td class="n w">0,00</td></tr>`).join('')}
  </tbody></table></div>
  <div class="card tot"><div class="row"><div>Quantità totale: <b id="tq">0</b></div><div>Peso totale: <b id="tk">0,00</b> kg</div>
  <span style="flex:1"></span><button id="rs">Azzera</button><button id="cp" class="p">Copia testo UN</button></div><div class="un" id="un"></div></div>`;
  $('#s').oninput=e=>{const v=e.target.value.toLowerCase();app.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.dataset.n.includes(v)?'':'none')};
  app.querySelectorAll('tbody tr').forEach(r=>r.querySelector('.q').oninput=e=>{qty[r.dataset.id]=Math.max(0,Math.floor(num(e.target.value)));calc()});
  $('#rs').onclick=()=>{qty={};show()};
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText($('#un').textContent);$('#cp').textContent='Copiato ✓'}catch(e){const r=document.createRange();r.selectNodeContents($('#un'));getSelection().removeAllRanges();getSelection().addRange(r)}setTimeout(()=>$('#cp').textContent='Copia testo UN',1500)};
  calc();
}
function calc(){
  let q=0,k=0;
  data.items.forEach(i=>{const n=qty[i.id]||0,w=n*i.kg;q+=n;k+=w;const r=app.querySelector(`tr[data-id="${i.id}"] .w`);if(r)r.textContent=fmt(w)});
  $('#tq').textContent=q;$('#tk').textContent=fmt(k);$('#un').textContent=`${data.unText}, pcs ${q} ,kg ${fmt(k)}`;
}
function save(){try{localStorage.setItem(DRAFT,JSON.stringify(data))}catch(e){}}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function fullHtml(){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.querySelector('#modal')?.remove();
  c.querySelector('#title').textContent='Calcolatore pesi';c.querySelector('#adm').textContent='🔒 Admin';
  c.querySelector('#seed').textContent=JSON.stringify(data);
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function showAdmin(){
  $('#title').textContent='后台管理 / Amministrazione';$('#adm').textContent='退出后台';
  app.innerHTML=`<div class="card"><p class="note">所有修改自动保存为本机草稿，客户暂时看不到。改完后点“导出完整HTML”（推荐，一个文件搞定），把下载的文件替换到原位置即可发布。</p>
  <label>UN 文本前缀 / testo UN<input id="un" value="${esc(data.unText)}"></label></div>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th class="n"></th><th>Articolo</th><th class="n">KG</th><th></th></tr></thead><tbody>
  ${data.items.map((i,x)=>`<tr data-x="${x}"><td class="n"><button class="u" title="上移"${x==0?' disabled':''}>▲</button> <button class="w2" title="下移"${x==data.items.length-1?' disabled':''}>▼</button></td><td><input class="a" value="${esc(i.name)}"></td><td class="n"><input class="k" style="width:100px;text-align:right" value="${String(i.kg).replace('.',',')}"></td><td class="n"><button class="d">删除</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="card row"><button id="ad" class="p">＋ 添加项目</button><span style="flex:1"></span><button id="pwb">修改密码</button><button id="im">导入 JSON</button><button id="ex">导出 articoli.json</button><button id="eh" class="p">导出完整HTML</button><button id="dc" class="d">放弃草稿</button><input id="fi" type="file" accept=".json" hidden></div>`;
  $('#un').oninput=e=>{data.unText=e.target.value;save()};
  app.querySelectorAll('tbody tr').forEach(r=>{const x=+r.dataset.x;
    r.querySelector('.a').oninput=e=>{data.items[x].name=e.target.value;save()};
    r.querySelector('.k').oninput=e=>{data.items[x].kg=num(e.target.value);save()};
    const mv=d=>{const y=x+d;if(y<0||y>=data.items.length)return;[data.items[x],data.items[y]]=[data.items[y],data.items[x]];save();showAdmin();const t=app.querySelector(`tbody tr[data-x="${y}"] ${d<0?'.u':'.w2'}`);if(t&&!t.disabled)t.focus()};
    r.querySelector('.u').onclick=()=>mv(-1);r.querySelector('.w2').onclick=()=>mv(1);
    r.querySelector('.d').onclick=()=>{if(confirm('删除「'+data.items[x].name+'」？')){data.items.splice(x,1);save();showAdmin()}}});
  $('#ad').onclick=()=>{data.items.push({id:'i'+Date.now(),name:'',kg:0});save();showAdmin();const a=app.querySelectorAll('.a');a[a.length-1].focus()};
  $('#ex').onclick=()=>dl('articoli.json',JSON.stringify(data,null,1),'application/json');
  $('#eh').onclick=()=>dl('calcolatore_pesi.html',fullHtml(),'text/html');
  $('#pwb').onclick=async()=>{const p=prompt('新密码 / Nuova password（至少4位）');if(p&&p.length>=4){data.pwHash=await sha(p);save();alert('已修改。导出并发布后生效。')}};
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.items))throw 0;data=d;save();showAdmin()}catch(_){alert('文件格式不正确')}})};
  $('#dc').onclick=()=>{if(confirm('放弃草稿并重新加载已发布数据？')){localStorage.removeItem(DRAFT);location.reload()}};
}
load();
</script></body></html>
